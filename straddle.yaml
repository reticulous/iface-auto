# iface-auto — AutoInterface transport for reticulous.
#
# IPv6 link-local multicast peer discovery + unicast UDP data,
# wire-compatible with upstream RNS AutoInterface. Active while netIsUp().
schema_version: 1
name: reticulous/iface-auto
prefix: rns_auto
version: 0.1.0
firmware: esp-idf
browser: browser
platforms: [idf]
requires:
  - reticulous/rns
  - spangap/spangap-net
optional_requires:
  # On-device AutoInterface settings pane — conditional/spangap-lcd/src/auto_lcd.cpp,
  # compiled only when the lcd straddle is staged. Registered via autoLcdRegister.
  - spangap/spangap-lcd
# Auto-init: folded into the generated spangapInitStraddles() dispatcher.
# autoInit() self-registers with rnsd via ITS; `requires: reticulous/rns` puts
# rnsd ahead of it in dependency-topo order, so its port surface is up first.
init:
  - call: autoInit
  - call: autoLcdRegister
    when: spangap/spangap-lcd
