# iface-auto — AutoInterface for reticulous.
#
# IPv6 link-local multicast peer discovery + unicast UDP data,
# wire-compatible with upstream RNS AutoInterface. Active while netIsUp().
schema_version: 1
name: reticulous/iface-auto
prefix: rns_auto
version: 0.0.0
firmware: esp-idf
platforms: [idf]
requires:
  - reticulous/rns
  - spangap/spangap-net
# Boot-registered service: the generated dispatcher constructs AutoService and
# calls AutoService::onInit(), which self-registers with rnsd via ITS.
# `requires: reticulous/rns` puts rnsd ahead of it in dependency-topo order, so
# its port surface is up first.
services:
  - { class: AutoService, header: auto.h }


# Declarative settings: both surfaces + the storage defaults are generated from
# this block. The live status rows show strings auto.cpp publishes finished —
# the state in words and the four counters as one line.
settings:
  - at:
      - { id: reticulum }
      - { id: interfaces }
    order: 2
    rows:
      - heading: "AutoInterface"
      - caption: "Zero-configuration RNS over the local network. Peers on the same WiFi link are discovered with IPv6 link-local multicast — no addresses to configure — and RNS packets travel over UDP. Wire-compatible with desktop Reticulum's AutoInterface. Requires WiFi to be up."
      - switch: { label: "Enable AutoInterface", key: "s.auto.enable", default: 0 }
      # How often this node says who it is is a property of the MEDIUM, so it
      # lives on each interface and not on any application: lxmf, rnsh and rlpg
      # keep their announce current with rnsd and never schedule anything. A
      # peer discovered mid-run is told at once (auto.cpp), so this beat is only
      # about the peers that were already there.
      - section: "Announces"
      - integer: { label: "Announce interval", unit: "min", key: "s.auto.announce_interval", min: 0, max: 1440, default: 30 }
      - caption: "How often this node tells the LAN who it is. 0 = only when something changes, a peer appears, or you press the button."
      - button: { label: "Announce now", do: { set: { key: "auto.announce_now", value: 1, edge: true } } }
      - info:
          rows:
            - value: { label: "State", key: "auto.state_text" }
            - value: { label: "Address", key: "auto.addr", copyable: true }
              when_key: auto.up
            - value: { label: "Peers", key: "auto.peers" }
            - value: { label: "Packets", key: "auto.traffic" }
      - advanced:
          rows:
            - text: { label: "Group", key: "s.auto.group", default: "reticulum" }
            - caption: "Only nodes sharing this name peer with each other. Changing it forms a separate network."
            - dropdown:
                label: "Interface mode"
                key: "s.auto.mode"
                default: "access_point"
                options:
                  - { v: "access_point", l: "Access point" }
                  - { v: "gateway",      l: "Gateway" }
                  - { v: "full",         l: "Full" }
                  - { v: "roaming",      l: "Roaming" }
                  - { v: "boundary",     l: "Boundary" }
            - integer: { label: "Community Radius", key: "s.auto.community_radius", min: 0, max: 7, default: 3 }
            - caption: "Nodes within this many hops on this interface are yours: their announces are kept and answered for, and searches run on their behalf. Everyone else is still heard and reachable. 0 = uplink: on-demand only."
            - section: "Interface access code (IFAC)"
            - caption: "A network name + passphrase every peer on this interface must match, or traffic is dropped. Leave both blank for an open interface."
            - text: { label: "IFAC network", key: "s.auto.ifac_netname" }
            - text: { label: "IFAC passphrase", key: "s.auto.ifac_netkey", secret: true }
