# iface-auto — AutoInterface for reticulous.
#
# IPv6 link-local multicast peer discovery + unicast UDP data,
# wire-compatible with upstream RNS AutoInterface. Active while netIsUp().
schema_version: 1
name: reticulous/iface-auto
prefix: rns_auto
version: 0.0.0
firmware: esp-idf
browser: browser
platforms: [idf]
requires:
  - reticulous/rns
  - spangap/spangap-net
# Boot-registered service: the generated dispatcher constructs AutoService and
# calls AutoService::onInit(), which self-registers with rnsd via ITS.
# `requires: reticulous/rns` puts rnsd ahead of it in dependency-topo order, so
# its port surface is up first.
services:
  - { class: AutoService, header: auto.h }

# Browser-side UI registration (parallel to services: above) — auto-wired into
# the buildable SPA via straddles.gen.ts; no web-interface edit needed.
browser_register:
  - call: registerAuto
    module: modules/auto

# Declarative settings: the LCD pane + storage defaults are generated from this
# block. web: false — the rich AutoPanel.vue (IFAC secret field, live status
# badges) keeps owning the web leaf; only the LCD + defaults are generated.
settings:
  - menu:
      - { id: mesh, label: "Mesh Network", placement: 3 }
      - { id: interfaces, label: "RNS Interfaces", placement: 2 }
      - { id: auto, label: "AutoInterface" }
    web: false
    rows:
      - section: "AutoInterface"
      - switch: { label: "Enable", key: "s.auto.enable", default: 0 }
      - text:   { label: "Group", key: "s.auto.group", default: "reticulum" }
      - dropdown:
          label: "Mode"
          key: "s.auto.mode"
          default: "gateway"
          options:
            - { v: "gateway",      l: "Gateway" }
            - { v: "full",         l: "Full" }
            - { v: "access_point", l: "Access point" }
            - { v: "roaming",      l: "Roaming" }
            - { v: "boundary",     l: "Boundary" }
      - section: "Status"
      - value: { label: "State", key: "auto.state" }
      - value: { label: "Peers", key: "auto.peers" }
      - value: { label: "Address", key: "auto.addr" }
